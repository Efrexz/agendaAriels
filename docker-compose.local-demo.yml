# ────────────────────────────────────────────────────────────────
# DEMO LOCAL: Evolution API para probar los WhatsApp en tu PC
# (no se publica a internet; solo 127.0.0.1 → no interfiere con
#  la instancia de producción que usa tu otro proyecto).
#
#   npm run demo:up      → levanta Evolution + Postgres + Redis
#   npm run demo:down    → lo detiene (los datos se conservan)
#
# Después: crear instancia "ariels-demo" y escanear el QR (ver
# sección "Demo local" del README).
# ────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: ariels_demo_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution
      POSTGRES_DB: evolution_demo
    volumes:
      - demo_pg_data:/var/lib/postgresql/data
    networks:
      - ariels_demo_net

  redis:
    image: redis:7-alpine
    container_name: ariels_demo_redis
    restart: unless-stopped
    volumes:
      - demo_redis_data:/data
    networks:
      - ariels_demo_net

  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: ariels_demo_evolution
    restart: unless-stopped
    ports:
      # Solo en localhost: nada queda expuesto a internet ni a tu red local.
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_NAME: ariels_demo
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      DOCKER_ENV: "true"

      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@postgres:5432/evolution_demo?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: ariels_demo
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"

      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_TTL: 604800
      CACHE_REDIS_PREFIX_KEY: ariels_demo
      CACHE_REDIS_SAVE_INSTANCES: "false"

      # Esta API key es la que va en .env.local como EVOLUTION_API_KEY
      # (valor de demo local, no secreto de producción).
      AUTHENTICATION_API_KEY: ariels-demo-key
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"

      CORS_ORIGIN: "*"
      CORS_METHODS: GET,POST,PUT,DELETE
      CORS_CREDENTIALS: "true"

      WEBHOOK_GLOBAL_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      SQS_ENABLED: "false"
      S3_ENABLED: "false"
    volumes:
      - demo_evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis
    networks:
      - ariels_demo_net

volumes:
  demo_pg_data:
  demo_redis_data:
  demo_evolution_instances:

networks:
  ariels_demo_net:
    name: ariels_demo_net
    driver: bridge
